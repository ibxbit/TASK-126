[package]
name = "shoreline"
version = "0.1.0"
description = "Shoreline Property Operations Console — offline-first desktop app"
edition = "2021"
rust-version = "1.75"
publish = false

[lib]
name = "shoreline"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "shoreline"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
tauri-plugin-global-shortcut = { version = "2" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"

uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
zeroize = "1"
argon2 = "0.5"
keyring = "3"
ed25519-dalek = "2"
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }
urlencoding = "2"
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
